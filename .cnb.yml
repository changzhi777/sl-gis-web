# CNB 流水线 · SL-GIS 自动部署到 COS+CDN
# 触发：推 main 分支 → build → 同步到 COS sl-gis/ 前缀
# 凭证：在 CNB 控制台「设置 → 密钥」建 SL-GIS-* 四个变量（前置 COS 操作也用同套）

version: "1.0"

stages:
  - name: build
    cpu: "2"
    memory: "4Gi"
  - name: deploy
    cpu: "1"
    memory: "1Gi"

# 全局环境（CNB 部署组密钥）
env:
  TENCENT_REGION: "ap-guangzhou"
  TENCENT_BUCKET: "sl-gis-static"
  TENCENT_PREFIX: "sl-gis/"
  TENCENT_APPID: "100050691448"

# 步骤 1：构建（Node 20）
step:
  name: "build"
  image: "node:20-slim"
  caches: ["node"]
  script:
    - "corepack enable"
    - "corepack prepare pnpm@10.33.0 --activate"
    - "pnpm install --frozen-lockfile"
    - "pnpm run typecheck"            # 类型检查
    - "pnpm run build"                 # vue-tsc + vite build → dist/
    - "ls -lh dist/ | head"            # 验证产物
  artifacts: "dist/"                    # 产物传下一阶段

# 步骤 2：部署到 COS（用 CNB 镜像里装 coscmd）
step:
  name: "deploy-to-cos"
  image: "python:3.12-slim"
  needs: ["build"]
  script:
    - "pip install --no-cache-dir coscmd==1.9.0.6"
    - "coscmd config -a ${SL-GIS-SECRET-ID} -s ${SL-GIS-SECRET-KEY} -b ${TENCENT_BUCKET}-${TENCENT_APPID} -r ${TENCENT_REGION} -u ${TENCENT_APPID}"
    - "coscmd upload -r --delete --sync -H 'Cache-Control: public, max-age=3600' -H 'Content-Type: application/javascript' dist/ /${TENCENT_PREFIX}"
    - "coscmd upload --sync -H 'Content-Type: application/json' -H 'Cache-Control: public, max-age=86400' dist/geo/banner.json /${TENCENT_PREFIX}geo/banner.json"
    - "echo '✓ 部署完成'"
  env: {}

