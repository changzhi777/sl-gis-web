main:
  push:
    - name: build-and-deploy
      imports:
        - https://cnb.cool/qingmu2026/sl-gis-secrets/-/blob/main/.cnb-env.yml
      env:
        TENCENT_APPID: "100050691448"
      runner:
        cpus: 4
      docker:
        image: node:20
      stages:
        - name: install
          script: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --no-frozen-lockfile
        - name: build
          script: pnpm run build && ls -lh dist/
        - name: deploy-cos
          script: node scripts/cos-upload.mjs
